name: package

# Packaging action for whyred (docs/porting/packaging.md).
#
# The firmware checkout is N1709/uefi-whyred. The manual run needs the device
# platform seed and produces images tied to one device. While the first build is
# being brought up, a push to main also runs it so the failure annotations are
# available without a manual dispatch. Remove the push trigger after bring-up.
#
# The platform seed comes from the repository secret UNIXNU_UNIQUE_CHIP_ID and is
# baked into the images, so the run's artifacts belong to one device alone:
# download them, then delete the run. Run it in a fork of this repository.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  OS_PROFILE: ios-16.7.16-20H392

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          path: UniXNU
          # Pin the framework: upstream main currently points
          # drivers/AppleKeyStoreState at 6ff4f11, a commit its remote no
          # longer advertises, so the deps submodule update fails before any
          # build step. b936519 is the revision this board's status, tree and
          # patch series were verified against.
          ref: b936519575e532872ad86456657bcb9cef9915df
          # The deps step initializes the module submodules it needs. A
          # recursive checkout here repeats that work and fails the whole run
          # before any build step when one submodule is unreachable.
          submodules: false
      - uses: actions/checkout@v4
        with:
          repository: N1709/uefi-whyred   # this board's firmware checkout
          path: uefi-whyred
          # Only [firmware] submodules are needed; the driver initializes them
          # one by one. A recursive checkout also pulls Mu_Basecore's optional
          # SPDM/unit-test trees, which are slow and not part of the build.
      - name: OS profile
        # The iOS 16 profile lives in this repository, not in UniXNU; install
        # it before defconfig and release resolve [board] os_profile. Its
        # series also names the 8796-adapted patches in device/patches.
        run: |
          mkdir -p UniXNU/profiles/os
          cp -a device/profiles/os/. UniXNU/profiles/os/
      - name: tools
        run: |
          brew install dtc llvm lld cmake mtools unifdef tcsh blacktop/tap/ipsw
          ok=1
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool \
                   mformat mcopy ipsw; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          for t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do
            [ -f "/opt/homebrew/opt/llvm/bin/$t" ] || [ -f "/opt/homebrew/opt/lld/bin/$t" ] || { echo "missing tool: $t"; ok=0; }
          done
          [ "$ok" = 1 ]
      - name: platform seed
        env:
          seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if ! [[ "$seed" =~ ^[0-9a-fA-F]{1,16}$ ]] || [[ "$seed" =~ ^0+$ ]]; then
            echo 'Set the repository secret UNIXNU_UNIQUE_CHIP_ID: the platform seed of the device, 1 to 16 hex digits, nonzero.' >&2
            exit 1
          fi
      - name: patch integrity
        # A hunk header with a wrong line count makes git apply ignore the extra
        # lines without an error. That is how kpc_pc_capture went missing while
        # osfmk/arm64/kpc.c was present and compiled. Fail before the build.
        run: python3 device/scripts/check-patches.py
      - name: package
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          # XNU's makedefs set KCC = $(CCACHE) $(CC) and leave CCACHE to the
          # build that drives it. The archive builders replay one compile from
          # the record next to that object, so the wrapper writes
          # <object>.json before it runs the compiler. Without it the first
          # pass leaves no startup.o.json, and the bootstrap link has no way
          # to build the mockfs fixture.
          CCACHE: ${{ github.workspace }}/device/scripts/compile-records.py
        run: |
          set -o pipefail
          scripts/package.sh --os "$OS_PROFILE" --uefi ../uefi-whyred 2>&1 | tee package.log
      - name: package error
        # Surface the failing line in the run's annotations; the job log itself
        # needs repository admin rights, the annotation does not. The kernel
        # build writes its diagnostics to kernel-bootstrap.log, so prefer the
        # compiler errors there over the make recursion in package.log.
        if: failure()
        working-directory: device
        run: |
          [ -f package.log ] || exit 0
          log=$(sed -n 's/^.*full log: //p' package.log | tail -1)
          if [ -n "$log" ] && [ -f "$log" ]; then
            # The parallel build interleaves warnings with the failure, so keep
            # only real failure lines: anchored clang diagnostics, make/link
            # errors and the undefined-symbol block with its object files.
            grep -nE '^[0-9]+:([^ :][^:]*:[0-9]+(:[0-9]+)?: (fatal )?error:|clang(\+\+)?: (fatal )?error:|Undefined symbols for architecture|duplicate symbol|No rule to make target|ld: | *"_[A-Za-z0-9_]+| *_[A-Za-z0-9_]+ in [^ ]+\.o$)' "$log" \
              > /tmp/xnu-errors || true
            if [ -s /tmp/xnu-errors ]; then
              context=$(tail -50 /tmp/xnu-errors | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN{ORS="%0A"} {print}')
              echo "::error::${context:0:6000}"
            else
              tail -12 "$log" | while IFS= read -r line; do
                echo "::error::${line:0:900}"
              done
            fi
          else
            tail -8 package.log | while IFS= read -r line; do
              echo "::error::${line:0:900}"
            done
          fi
      - name: build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            device/package.log
            UniXNU/out/whyred/*/whyred/logs/*.log
          if-no-files-found: ignore
          retention-days: 3
      - name: single image
        # unixnu release leaves boot/boot.img with everything in one file:
        # BootShim + SILICIUM_UEFI.fd + whyred.dtb in the kernel field and
        # payload.img (XNU kernel, ADT, config) in the ramdisk field. This step
        # gives that one file the release name; nothing is split afterwards.
        run: |
          src=$(find UniXNU/out/whyred -name boot.img -print -quit)
          test -n "$src"
          cp "$src" Mu-whyred.img
          ls -l Mu-whyred.img
      - name: images
        uses: actions/upload-artifact@v4
        with:
          name: Mu-whyred
          retention-days: 1
          if-no-files-found: error
          path: |
            Mu-whyred.img
            UniXNU/out/whyred/*/*/package.manifest.json
