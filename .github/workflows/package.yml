name: package

# Packaging action for whyred (docs/porting/packaging.md).
#
# The firmware checkout is N1709/uefi-whyred. The manual run needs the device
# platform seed and produces images tied to one device. While the first build is
# being brought up, a push to main also runs it so the failure annotations are
# available without a manual dispatch. Remove the push trigger after bring-up.
#
# The platform seed comes from the repository secret UNIXNU_UNIQUE_CHIP_ID and is
# baked into the images, so the run's artifacts belong to one device alone:
# download them, then delete the run. Run it in a fork of this repository.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      os:
        description: "OS profile of the images"
        type: choice
        options: ["ios-16.7.16-20H392", "ipados-17.7.11-21H461"]
        default: "ios-16.7.16-20H392"

env:
  OS_PROFILE: ${{ inputs.os || 'ios-16.7.16-20H392' }}

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          path: UniXNU
          # The deps step initializes the module submodules it needs. A
          # recursive checkout here repeats that work and fails the whole run
          # before any build step when one submodule is unreachable.
          submodules: false
      - uses: actions/checkout@v4
        with:
          repository: N1709/uefi-whyred   # this board's firmware checkout
          path: uefi-whyred
          # Only [firmware] submodules are needed; the driver initializes them
          # one by one. A recursive checkout also pulls Mu_Basecore's optional
          # SPDM/unit-test trees, which are slow and not part of the build.
      - name: OS profile
        # The iOS 16 profile lives in this repository, not in UniXNU; install
        # it before defconfig and release resolve [board] os_profile. The arch
        # series applies the tunables patch first, so replace that upstream copy
        # with the one that matches both 8796 and 10063 start.s layouts.
        run: |
          mkdir -p UniXNU/profiles/os
          cp -a device/profiles/os/. UniXNU/profiles/os/
          cp device/patches/xnu/apple-only-cpu-tunables.patch \
             UniXNU/patches/xnu/apple-only-cpu-tunables.patch
      - name: tools
        run: |
          brew install dtc llvm lld cmake mtools unifdef tcsh blacktop/tap/ipsw
          ok=1
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool \
                   mformat mcopy ipsw; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          for t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do
            [ -f "/opt/homebrew/opt/llvm/bin/$t" ] || [ -f "/opt/homebrew/opt/lld/bin/$t" ] || { echo "missing tool: $t"; ok=0; }
          done
          [ "$ok" = 1 ]
      - name: platform seed
        env:
          seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if ! [[ "$seed" =~ ^[0-9a-fA-F]{1,16}$ ]] || [[ "$seed" =~ ^0+$ ]]; then
            echo 'Set the repository secret UNIXNU_UNIQUE_CHIP_ID: the platform seed of the device, 1 to 16 hex digits, nonzero.' >&2
            exit 1
          fi
      - name: package
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          scripts/package.sh --os "$OS_PROFILE" --uefi ../uefi-whyred 2>&1 | tee package.log
      - name: package error
        # Surface the failing line in the run's annotations; the job log itself
        # needs repository admin rights, the annotation does not.
        if: failure()
        working-directory: device
        run: |
          [ -f package.log ] || exit 0
          tail -8 package.log | while IFS= read -r line; do
            echo "::error::${line:0:900}"
          done
      - name: single image
        # unixnu release leaves boot/boot.img with everything in one file:
        # BootShim + SILICIUM_UEFI.fd + whyred.dtb in the kernel field and
        # payload.img (XNU kernel, ADT, config) in the ramdisk field. This step
        # gives that one file the release name; nothing is split afterwards.
        run: |
          src=$(find UniXNU/out/whyred -name boot.img -print -quit)
          test -n "$src"
          cp "$src" Mu-whyred.img
          ls -l Mu-whyred.img
      - name: images
        uses: actions/upload-artifact@v4
        with:
          name: Mu-whyred-${{ env.OS_PROFILE }}
          retention-days: 1
          if-no-files-found: error
          path: |
            Mu-whyred.img
            UniXNU/out/whyred/*/*/package.manifest.json
