name: package

# Packaging action for whyred (docs/porting/packaging.md).
#
# The firmware checkout is N1709/uefi-whyred. It stays a manual workflow because
# it needs the device platform seed and produces images tied to one device. The
# porting-record workflow is the check that runs on every push.
#
# The platform seed comes from the repository secret UNIXNU_UNIQUE_CHIP_ID and is
# baked into the images, so the run's artifacts belong to one device alone:
# download them, then delete the run. Run it in a fork of this repository.

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS profile of the images"
        type: choice
        options: ["17"]
        default: "17"

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          path: UniXNU
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: N1709/uefi-whyred   # this board's firmware checkout
          path: uefi-whyred
          submodules: recursive
      - name: tools
        run: |
          brew install dtc llvm lld cmake mtools blacktop/tap/ipsw
          ok=1
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool \
                   mformat mcopy ipsw; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          for t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do
            [ -f "/opt/homebrew/opt/llvm/bin/$t" ] || [ -f "/opt/homebrew/opt/lld/bin/$t" ] || { echo "missing tool: $t"; ok=0; }
          done
          [ "$ok" = 1 ]
      - name: platform seed
        env:
          seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if ! [[ "$seed" =~ ^[0-9a-fA-F]{8}$ ]]; then
            echo 'Set the repository secret UNIXNU_UNIQUE_CHIP_ID: the platform seed of the device, 8 hex digits.' >&2
            exit 1
          fi
      - name: package
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/package.sh --os "${{ inputs.os }}" --uefi ../uefi-whyred
      - name: images
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ inputs.os }}
          retention-days: 1
          if-no-files-found: error
          path: |
            UniXNU/out/whyred/*/*/boot/boot.img
            UniXNU/out/whyred/*/*/payload/payload.img
            UniXNU/out/whyred/*/*/kernel/kernel.macho
            UniXNU/out/whyred/*/*/package.manifest.json
