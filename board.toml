schema_version = 2

# Xiaomi Redmi Note 5 / Note 5 AI (whyred), Qualcomm SDM636.
# Hardware values: Whyred-Dev/android_kernel_xiaomi_sdm660, lineage-15.1,
# d85fa37dba33a7ad7a4f5435930cae06df18f7db (sdm636.dtsi, sdm660_whyred.dtsi).
# Target image: unmodified iPad7,1 / iPadOS 17.7.11 / 21H461, 4 KiB pages.
# Kryo 260 is ARMv8.0 without pointer authentication, so the arm64 profile is
# used, not arm64e.

[board]
name = "whyred"
soc = "SDM636"
soc_source = "sdm660"
os_profile = "ipados-17.7.11-21H461"
description = "Xiaomi Redmi Note 5 (whyred)"
kit = "whyred"

[components]
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]

[userdata]
# GPT entry "userdata" on the eMMC, 4096-byte logical blocks.
# first_lba 0x2b8c00 and 109643 MiB are the values the previous whyred XNU
# storage driver read from the device. last_lba keeps the backup GPT untouched.
first_lba = 0x2b8c00
last_lba = 0x1d7d6ff
lba_bytes = 4096

[kernel]
defconfig = "whyred_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sdm660.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]

[device_tree]
source = "device:dts/whyred.dts"
include_dirs = ["soc:dts"]

[firmware]
# Firmware checkout: N1709/uefi-whyred, a UniXNU/uefi-sheng fork. The first
# build is vendor-free: GOP over the ABL framebuffer, FDT memory expansion,
# UniXNU RamDisk/DarwinBoot and no Binaries/<device> DXE. Nothing is flashed
# by this repository's boot path: the device is booted with "fastboot boot"
# only.
config = "whyred"
dsc = "Platforms/Xiaomi/whyredPkg/whyred.dsc"
fd = "Build/whyredPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
# Compiles dts/whyred.dts into <tree>/dts/whyred.dtb, the tree [bootimg] appends.
preflight = ["scripts/build-whyred-dtb.py"]
submodules = ["Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
packages = ["{uefi}", "{uefi}/Platforms/Xiaomi", "{tree}/package", "{tree}/drivers/DarwinBoot", "{edk2}", "{uefi}/Common/Mu", "{uefi}/Common/Mu_OEM_Sample", "{uefi}/Silicon/Qualcomm", "{uefi}/Silicon/Silicium", "{uefi}/Silicium-ACPI", "{uefi}/Silicium-ACPI/Platforms/Xiaomi", "{uefi}/Silicium-ACPI/Silicon/Qualcomm"]

[firmware.defines]
# SiliciumPkg tests $(ENABLE_SECUREBOOT) in C preprocessor expressions; the
# value must be a number even when secure boot is off.
ENABLE_SECUREBOOT = "0"

[payload]
volume = "WHYREDESP"
size_mib = 192
loader = "firmware"
title = "UniXNU"
dram_size = "0x80000000"
panic_screen = true
kernel_args = ["-v", "serial=3", "debug=0x14e"]

[payload.adt]
# Software platform identity, not an Apple chip ID. The board seed is supplied
# at build time through --unique-chip-id / UNIXNU_UNIQUE_CHIP_ID.
chip_id = "636"
owned_memory_size = "0x40000000"
packed_data_ramdisk = true
unique_chip_id = "required"

[bootimg]
# scripts/build-whyred-dtb.py writes this file into the build tree before the
# firmware step. One "unixnu build" then produces a single boot.img: BootShim
# plus SILICIUM_UEFI.fd and the DTB in the kernel field, payload.img in the
# ramdisk field.
dtb = "dts/whyred.dtb"
# The splash reservation is already the value the vendor bootloader leaves for
# the kernel: 0x9d400000 + 36 MiB.
[[bootimg.dtb_node]]
path = "/reserved-memory/splash_region"
props = [
  { name = "label", type = "s", value = "cont_splash_region" },
  { name = "reg", type = "x", value = ["0x0", "0x9d400000", "0x0", "0x2400000"] },
]

[package]
# The UniXNU checkout, relative to this repository: scripts/package.sh reads it.
unixnu = "../UniXNU"

[package.defconfig]
"ipados-17.7.11-21H461" = "whyred_defconfig"
