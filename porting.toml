schema_version = 1

[device]
name = "whyred"
soc = "SDM636"
os_profile = "ipados-17.7.11-21H461"
summary = "Xiaomi Redmi Note 5 (whyred), SDM636 / Kryo 260 / ARMv8.0. Format 2 device repository targeting the unmodified iPad7,1 iPadOS 17.7.11 image; firmware, storage, display and input are the open bring-up areas."

[[area]]
id = "configuration"
status = "implemented"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "soc/**", "configs/**", "dts/**", "drivers/**", ".github/**", ".gitignore", "local.toml.example"]
inputs = [
  "Xiaomi whyred (SDM636) with 8 Kryo 260 cores: 4x Cortex-A73 MPIDR 0x100-0x103 and 4x Cortex-A53 MPIDR 0x0-0x3; qcom,msm-id = <345 0x0>.",
  "Unmodified iPad7,1 / iPadOS 17.7.11 / 21H461 image with 4 KiB pages; Kryo 260 is ARMv8.0 without pointer authentication, so the arm64 profile is used.",
  "SDM660/SDM636 shared support is carried locally in soc/sdm660 until UniXNU-sdm660-common is published; feeds.toml selects it as kind = \"soc\".",
]
configuration = [
  "board.toml: schema_version = 2, soc = \"SDM636\", soc_source = \"sdm660\", os_profile = \"ipados-17.7.11-21H461\", kit = \"whyred\", example absent.",
  "[components] include selects ArmDTPlatform, ArmCpu, SoftwareAES, XnuPrelink and DarwinBoot; the resolver adds their dependencies in build order.",
  "config_fragments = arch:configs/common.config, soc:configs/sdm660.config, os:configs/ipados.config; configs/whyred_defconfig applies the board overrides last.",
  "patch_series = arch, soc, os and device series in that order; the soc and device series are empty for now.",
  "dts/whyred.dts includes soc:dts/sdm660.dtsi; the board owns RAM, the splash reservation and the product compatible.",
]
procedure = [
  "From the UniXNU checkout: scripts/check-whyred.sh (dtc, make-adt.py, unixnu defconfig, unixnu status, unixnu tree and porting-record.py check; CHECK_FETCH=1 adds unixnu fetch).",
  "From the UniXNU checkout: ./unixnu defconfig whyred_defconfig -D ../UniXNU-whyred",
  "./unixnu fetch -D ../UniXNU-whyred (writes unixnu.lock; run, and the lock is committed).",
  "./unixnu status --json -D ../UniXNU-whyred",
  "python3 scripts/porting-record.py check --device ../UniXNU-whyred",
]
findings = [
  "The vendor DT puts qcom,msm-id = <345 0x0> in sdm636.dtsi, which separates whyred from the SDM660 clover port (msm-id 317).",
  "The previous whyred XNU work used a contiguous splash buffer at 0x9d400000 + 36 MiB; the board DTS keeps the same reservation.",
  "The shared directory is a local SoC feed, not a copied core checkout: moving it later changes only feeds.toml and the pin.",
  "Every change under .github/** belongs to this area, so a workflow edit must add a finding or evidence entry here; the porting-record check rejects a workflow-only commit.",
  "The manual package workflow now points at N1709/uefi-whyred instead of the REPLACE/uefi-whyred placeholder.",
  "board.toml [firmware] now resolves the published N1709/uefi-whyred tree: dsc whyredPkg/whyred.dsc, fd Build/whyredPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd and the EDK II submodule/package list used by unixnu build firmware.",
]
completion = [
  "unixnu status resolves arch arm64, soc sdm660, OS ipados-17.7.11-21H461 and device whyred with no missing source.",
  "porting-record check reports 13 structured areas and no errors.",
  "dtc and make-adt.py accept dts/whyred.dts with the selected SoC include.",
]
limits = [
  "soc/sdm660 is not yet a published shared repository; the local feed entry is the migration point.",
  "Firmware, storage, display, input, GPU, network, audio and power work are not implemented.",
]
next_action = [
  "Publish UniXNU-sdm660-common or keep the local layer, then start the whyred firmware port.",
]
evidence = [
  { kind = "source", reference = "board.toml", result = "Format 2 board with whyred identity, userdata geometry, kernel, payload and package settings." },
  { kind = "source", reference = "feeds.toml", result = "Local sdm660 SoC feed plus the pinned whyred vendor device-tree provenance source." },
  { kind = "source", reference = "unixnu.lock", result = "Resolved pins for xnu, edk2, corecrypto-2023, libdispatch, libplatform, libpthread, IOStorageFamily, AvailabilityVersions and whyred-android-dt." },
  { kind = "source", reference = "soc/sdm660/soc.toml", result = "SDM660/SDM636 SoC profile with the vendor revision and shared component set." },
  { kind = "source", reference = "configs/whyred_defconfig", result = "Board defconfig with CONFIG_XNU_NATIVE_PAN=n and the eMMC/no-GPU switch set." },
  { kind = "source", reference = ".github/workflows/porting-record.yml", result = "Reusable UniXNU porting-record check on every push and pull request." },
  { kind = "source", reference = ".github/workflows/package.yml", result = "Manual macOS packaging workflow using N1709/uefi-whyred and the UNIXNU_UNIQUE_CHIP_ID seed." },
]

[[area]]
id = "firmware"
status = "planned"
components = ["DarwinBoot"]
paths = ["proprietary-files.txt", "scripts/**"]
inputs = [
  "No Mu-Silicium / UEFI port exists for whyred yet. The boot path must stay \"fastboot boot\" only: never flash boot, modem, persist or recovery, and never format userdata.",
  "Vendor bootloader is Xiaomi ABL; the DT identifies the platform as qcom,msm-id <345 0x0>.",
  "The firmware platform needs UniXNURamDiskDxe, DiskIoDxe and FAT support in its DSC/FDF for the initrd payload.",
]
configuration = [
  "[firmware] fixes config = \"whyred\"; dsc, fd, packages and preflight scripts are commented out until the firmware repository exists.",
  "proprietary-files.txt is the input manifest; no archive hash is recorded until the official fastboot archive is pinned.",
]
procedure = [
  "HANDOFF.md fixes the base: fork UniXNU/uefi-sheng at 66421cb, take the SDM660 memory map from lavenderPkg and the UniXNU/DarwinBoot/RamDisk/FAT block from shengPkg.",
  "Create whyredPkg with PcdSystemMemoryBase 0x80000000, stack 0x9FF90000, framebuffer 1080x2160 and the lavender memory map; add Resources/Configs/whyred.toml with FD base 0x9FC00000 and size 0x300000.",
  "Add the board DTB from dts/whyred.dts plus soc/sdm660/dts/sdm660.dtsi, then build with ./build_uefi.py -d whyred -r RELEASE.",
  "Fill [firmware] dsc, fd, packages and preflight, add [firmware.image] with the official archive URL, size and hashes, then list every extracted input in proprietary-files.txt.",
]
findings = [
  "No whyred UEFI repository exists; clover's firmware is a format 1 platform and cannot be used unchanged.",
  "The closest platform is lavenderPkg (SDM660): its memory map already matches whyred, including the 0x9D400000 + 36 MiB display window.",
  "Lavender's USE_CUSTOM_DISPLAY_DRIVER points at a closed vendor DisplayDxe for its panel; whyred needs its own vendor DXE or a generic GOP over the ABL framebuffer.",
  "Booting with fastboot boot keeps the vendor boot and modem partitions untouched, which is the required safety boundary for this device.",
]
completion = [
  "A fastboot-booted firmware image reaches the UniXNU menu and publishes a framebuffer.",
  "The firmware device tree matches the board DTS memory and splash reservations.",
]
limits = [
  "Blocked on a whyred Mu-Silicium port; [firmware] is deliberately incomplete.",
]
next_action = [
  "Create N1709/uefi-whyred from the HANDOFF.md base, stage the whyred vendor display/I2C/TLMM/PMIC DXEs, build whyredPkg and record the first serial log.",
]
evidence = [
  { kind = "source", reference = "HANDOFF.md", result = "Base commit, DSC values, UniXNU module list, vendor display blocker and verification order." },
]

[[area]]
id = "cpu"
status = "implemented"
components = ["ArmCpu"]
paths = ["dts/**", "soc/**"]
inputs = [
  "Eight Kryo 260 cores: Cortex-A73 MPIDR 0x100, 0x101, 0x102, 0x103 and Cortex-A53 MPIDR 0x0, 0x1, 0x2, 0x3.",
  "GICv3 distributor at 0x17a00000 + 64 KiB and redistributor frame at 0x17b00000 + 8 x 128 KiB; redistributor-stride 0x20000.",
  "ARM generic timer at 19.2 MHz; PPI 1, 2, 3 and 0 with flags 0xf08.",
]
configuration = [
  "/cpus timebase-frequency = <19200000>; each CPU has device_type = \"cpu\", its MPIDR in reg, enable-method = \"psci\" and a cluster type (P for A73, E for A53).",
  "/psci compatible = \"arm,psci-1.0\", method = \"smc\".",
  "intc compatible = \"arm,gic-v3\", #interrupt-cells = <3>, two (address, size) register pairs and redistributor-stride = <0x0 0x20000>.",
]
procedure = [
  "dtc -I dts -O dtb -i ../UniXNU-whyred/soc/sdm660/dts -o /tmp/whyred.dtb ../UniXNU-whyred/dts/whyred.dts",
  "python3 scripts/make-adt.py --dtb /tmp/whyred.dtb --os-profile profiles/os/ipados-17.7.11-21H461/profile.toml --board ../UniXNU-whyred/board.toml --unique-chip-id 0000000000000636 --data-ramdisk --trust-cache --output /tmp/whyred.adt",
]
findings = [
  "ArmCpu requires /arm-io/intc to carry the exact 11-byte compatible \"arm,gic-v3\" and exactly two register pairs, so the DTS keeps the distributor and redistributor ranges separate.",
  "The vendor GICR allocation is 0x100000 bytes, which covers eight 128 KiB frames; a smaller range would fail the ArmCpu probe.",
]
completion = [
  "The boot CPU reaches arm_vm_init and the console.",
  "Enabling sheng-smp starts the remaining cores and each cluster registers with the scheduler.",
]
limits = [
  "No hardware boot from this repository yet; CPU frequency, IPI routing and cluster migration are not measured.",
]
next_action = [
  "Boot the first image with one CPU, then enable sheng-smp and verify each secondary reaches its entry checkpoint.",
]
evidence = [
  { kind = "source", reference = "soc/sdm660/dts/sdm660.dtsi", result = "8 CPUs, PSCI, GICv3 and the 19.2 MHz generic timer described from the vendor DT." },
]

[[area]]
id = "memory"
status = "implemented"
components = ["ArmDTPlatform"]
paths = ["dts/**", "soc/**"]
inputs = [
  "Low DRAM bank at 0x80000000 with 2 GiB, present on the 3/4/6 GB whyred variants.",
  "Contiguous splash region at 0x9d400000 with 36 MiB.",
  "The first boot uses a 1 GiB owned window, matching the safe model used by UniXNU-clover.",
]
configuration = [
  "dts/whyred.dts: memory@80000000 reg = <0x0 0x80000000 0x0 0x80000000>; exactly one enabled memory node.",
  "reserved-memory splash@9d400000 reg = <0x0 0x9d400000 0x0 0x2400000>, label cont_splash_region.",
  "board.toml: payload dram_size = \"0x80000000\"; payload.adt owned_memory_size = \"0x40000000\".",
]
procedure = [
  "Generate the DTB with dtc and inspect it with fdtget/fdtput.",
  "Run make-adt.py and confirm /chosen dram-base, dram-size and darwinboot-memory-size.",
]
findings = [
  "The ADT generator accepts exactly one contiguous /memory range; the high 6 GB bank at 0x100000000 is omitted for the first boot.",
  "A 1 GiB owned window leaves the low firmware and bootloader allocations outside the XNU working set, as on clover.",
]
completion = [
  "DarwinBoot publishes the 1 GiB window and XNU completes pmap bootstrap.",
  "The framebuffer reservation is not overwritten by kernel allocations.",
]
limits = [
  "Variant-dependent high DRAM is not described yet; the 3 GB and 6 GB banks remain a later extension.",
]
next_action = [
  "Read the live memory map from the whyred firmware port and extend the DTS if the owned window must use high memory.",
]
evidence = [
  { kind = "source", reference = "dts/whyred.dts", result = "Single 2 GiB low DRAM range and the 0x9d400000 splash reservation." },
  { kind = "source", reference = "drivers/WhyredSdhci/WhyredSdhci.c", result = "Staged whyred SDHCI driver from the earlier XNU port; read, GPT and HFSX mount verified on the phone." },
  { kind = "source", reference = "drivers/reference/clover/CloverSdhci/CloverSdhci.cpp", result = "Native UniXNU SDHCI reference for the same 0xc0c4000 controller." },
]

[[area]]
id = "storage"
status = "planned"
components = []
paths = ["drivers/WhyredSdhci/**", "drivers/WhyredBlock/**", "package/**", "dts/**"]
inputs = [
  "eMMC controller sdhc_1 at 0xc0c4000: hc_mem 0x1000, cmdq_mem 0x1000, IRQ 110 and 112, 8-bit bus.",
  "userdata GPT entry at 4 KiB LBA 0x2b8c00 through 0x1d7d6ff, 109643 MiB; the backup GPT follows it.",
  "The device must not be flashed; the root image is staged inside userdata by the user, not by this repository.",
]
configuration = [
  "board.toml [userdata] first_lba, last_lba and lba_bytes = 4096.",
  "soc/sdm660/dts/sdm660.dtsi exports the eMMC controller as arm-io/sdhc.",
  "No storage component is selected; CONFIG_XNU_NATIVE_UFS is unset because whyred is eMMC.",
]
procedure = [
  "Implement or select a reusable SDHCI block driver, enumerate the GPT and publish the OS/SystemOS windows inside userdata.",
  "Verify capacity, GPT CRC and known sectors before enabling writes.",
]
findings = [
  "whyred is eMMC, not UFS: ShengUfs and the native UFS path do not apply.",
  "The previous XNU storage driver read first block 0x2b8c00 and 109643 MiB from this GPT entry, which fixes the board geometry.",
  "drivers/WhyredSdhci/WhyredSdhci.c is the earlier whyred polled SDHCI driver, staged with the WHYRED guard; it verified PIO/SDMA reads, GPT parse and an HFSX mount on the phone.",
  "drivers/reference/clover/CloverSdhci is the native UniXNU driver for the same SDCC1 block at 0xc0c4000 and is the model for the native whyred path; clover's userdata LBA window does not apply.",
]
completion = [
  "GPT parse and capacity read match the device; OS and SystemOS windows stay inside userdata.",
  "A persistent Data volume survives reboot without touching the backup GPT.",
]
limits = [
  "No storage driver yet; the current milestone stops before any block device is published.",
]
next_action = [
  "Bring up the SDHCI host in read-only mode, then publish the block device and mount the GPT windows.",
]
evidence = []

